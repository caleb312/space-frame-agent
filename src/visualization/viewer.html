</section><aside class="aside"><div class="tabs"><button class="active" data-tab="overview">结构</button><button data-tab="nodes">节点</button><button data-tab="ends">杆端力</button><button data-tab="sections">截面</button><button data-tab="loads">荷载</button><button data-tab="material">参数</button></div><div id="detail" class="detail"></div></aside></div>

<script>
'use strict';
const D=__DATA__;
const activeDofs=D.native_dof_indices||[0,1,2,3,4,5],native=!!D.native_dof_indices,isTruss=['plane_truss','space_truss'].includes(D.structure_type);
const endIndices=native?[0,1,5]:[0,1,2,3,4,5],sectionIndices=isTruss?[0]:endIndices;
const selectValues=(values,indices)=>indices.map(i=>values[i]);
const $=id=>document.getElementById(id), fmt=v=>typeof v==='number'?(v===0?'0':v.toPrecision(7)):'—';
const nodeMap=new Map(D.nodes.map(n=>[n.id,n]));
let tab='overview',nodeId=D.nodes[0].id,elementId=D.elements[0].id,sectionId=D.sections.length?D.sections[0].id:null;
let firstPlot=true;
let view='iso';
const initialCamera={eye:{x:1.25,y:-1.55,z:1.05},up:{x:0,y:0,z:1},projection:{type:'perspective'}};
function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function table(labels,values,units=''){return '<table><tbody>'+labels.map((k,i)=>'<tr><th>'+escapeText(k)+'</th><td>'+fmt(values[i])+(units?' '+escapeText(units):'')+'</td></tr>').join('')+'</tbody></table>';}
function choose(items,id,label){return '<select id="itemSelect">'+items.map(item=>'<option value="'+item.id+'" '+(item.id===id?'selected':'')+'>'+label+item.id+'</option>').join('')+'</select>';}
function download(key){const blob=new Blob(['\ufeff'+D.csv[key]],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='space_frame_'+key+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function detail(){
 let content='';const solved=D.solved;
 if(tab==='overview'){
  content='<h2>结构模型</h2><div class="row"><span>节点 / 构件</span><strong>'+D.nodes.length+' / '+D.elements.length+'</strong></div><h3>连接关系</h3><table><tr><th>构件</th><th>i → j</th><th>长度 / m</th></tr>'+D.elements.map(e=>'<tr><td>'+e.id+'</td><td>'+e.node_i+' → '+e.node_j+'</td><td>'+fmt(e.length)+'</td></tr>').join('')+'</table><h3>坐标约定</h3><p class="small">X、Y、Z 为全局坐标，长度单位 m。'+(native?'局部x沿i→j；桁架只使用轴向内力。':'各杆局部轴由模型指定；')+'打开“局部轴”查看。</p><div class="note">'+(solved?'本页读取已求解结果，变形与内力由程序恢复。':'这是模型预览，尚未求解；不显示位移和内力。')+'</div><h3>追溯</h3><code>'+D.model_hash+'</code>';
 }else if(tab==='nodes'){
  const n=nodeMap.get(nodeId);content='<h2>节点数值</h2>'+choose(D.nodes,nodeId,'节点 ')+table(['X','Y','Z'],n.coordinates,'m')+'<h3>约束</h3><p class="small">'+activeDofs.map(i=>['ux','uy','uz','rx','ry','rz'][i]+': '+(n.restrained[i]?'固定':'自由')).join(' · ')+'</p>';
  if(solved)content+='<h3>位移 / 转角</h3>'+table(selectValues(['ux / m','uy / m','uz / m','rx / rad','ry / rad','rz / rad'],activeDofs),selectValues(n.displacement,activeDofs))+'<h3>支座反力</h3>'+table(selectValues(['Rx / '+D.force_unit,'Ry / '+D.force_unit,'Rz / '+D.force_unit,'Mx / '+D.force_unit+'·m','My / '+D.force_unit+'·m','Mz / '+D.force_unit+'·m'],activeDofs),selectValues(n.reaction,activeDofs))+'<button class="download" data-csv="nodes">导出节点位移 CSV</button><button class="download" data-csv="reactions">导出支座反力 CSV</button>';
  content+='<div class="note">平动、转角及反力均沿全局坐标。转角与力矩显示为教材附录右手正号。</div>';
 }else if(tab==='ends'){
  const e=D.elements.find(e=>e.id===elementId);content='<h2>'+(isTruss?'桁架轴力':'局部杆端内力')+'</h2>'+choose(D.elements,elementId,'构件 ')+'<p class="small">i端：节点'+e.node_i+'，j端：节点'+e.node_j+'</p>';
  if(solved){if(isTruss)content+=table(['N / '+D.force_unit],[e.axial_force]);else for(const side of ['i','j'])content+='<h3>'+side+' 端</h3>'+table(selectValues(['Fx / '+D.force_unit,'Fy / '+D.force_unit,'Fz / '+D.force_unit,'Mx / '+D.force_unit+'·m','My / '+D.force_unit+'·m','Mz / '+D.force_unit+'·m'],endIndices),selectValues(e['end_'+side],endIndices));}
  else content+='<div class="note">模型尚未求解。</div>';
  content+='<div class="note">'+(isTruss?'N受拉为正、受压为负；桁架仅计算轴力。':'这是包含固定端项的真实杆端力。沿本杆局部坐标，力矩显示为右手正号；与截面正号分开解释。')+'</div>';
 }else if(tab==='sections'){
  content='<h2>指定截面内力</h2>';
  if(!D.sections.length)content+='<p>没有截面请求。</p>';else{const s=D.sections.find(s=>s.id===sectionId);content+=choose(D.sections,sectionId,'截面 ')+'<p class="small">构件 '+s.element_id+' · 距i端 '+fmt(s.position)+' m · '+(s.side==='right'?'右':'左')+'侧极限</p>';if(solved)content+=table(selectValues(['N / '+D.force_unit,'Qy / '+D.force_unit,'Qz / '+D.force_unit,'T / '+D.force_unit+'·m','My / '+D.force_unit+'·m','Mz / '+D.force_unit+'·m'],sectionIndices),selectValues(s.forces,sectionIndices))+'<button class="download" data-csv="sections">导出截面 CSV</button>';else content+='<div class="note">已登记查询位置，模型尚未求解，不显示内力数值。</div>';}
  content+='<div class="note">采用教材截面正号。集中荷载位置可能出现左右值跳跃；色带采样保留这些跳跃。</div>';
 }else if(tab==='loads'){
  content='<h2>原始荷载</h2>'+D.loads.map(l=>'<h3>'+escapeText(l.label)+'</h3><p class="small">'+escapeText(l.description)+(l.interval?' · 区间 ['+l.interval.join(',')+'] m':'')+'</p>'+table(['全局 X','全局 Y','全局 Z'],l.global_components,l.unit)).join('')+'<div class="note">图中的箭头只示方向。力矩为全局右手分量；均布力按单位实际杆长计。未将杆上荷载人为移动到节点。</div>';
 }else{
  content='<h2>材料与截面</h2>'+D.materials.map(m=>'<h3>材料 '+m.id+'</h3>'+table(native?['E']:['E','G'],native?[m.E]:[m.E,m.G],D.force_unit+'/m²')).join('')+D.section_properties.map(s=>'<h3>截面 '+s.id+'</h3>'+table(native?(isTruss?['A / m²']:['A / m²','I / m⁴']):['A / m²','Iy / m⁴','Iz / m⁴','J / m⁴'],native?(isTruss?[s.A]:[s.A,s.I]):[s.A,s.Iy,s.Iz,s.J])).join('')+'<div class="note">'+(native?'参数来自当前模型；等效材料/截面须按题给刚度解释。':'J 为 Saint-Venant 扭转常数。数值来自已确认模型，不由图形库或 AI 计算。')+'</div>';
 }
 $('detail').innerHTML=content;
 const select=$('itemSelect');if(select)select.onchange=()=>{const id=Number(select.value);if(tab==='nodes')nodeId=id;else if(tab==='ends')elementId=id;else sectionId=id;detail();render();};
 document.querySelectorAll('[data-csv]').forEach(b=>b.onclick=()=>download(b.dataset.csv));
}
function setTab(name){tab=name;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));detail();}
function line(paths,color,width,text,custom=null){const x=[],y=[],z=[],texts=[],data=[];for(const path of paths){for(const p of path){x.push(p[0]);y.push(p[1]);z.push(p[2]);texts.push(text);data.push(custom);}x.push(null);y.push(null);z.push(null);texts.push('');data.push(null);}return {type:'scatter3d',mode:'lines',x,y,z,line:{color,width},text:texts,customdata:data,hoverinfo:'text',showlegend:false};}
function markers(points,labels,color,size,symbol,custom,hover=labels,showLabels=true){return {type:'scatter3d',mode:$('labels').checked&&showLabels?'markers+text':'markers',x:points.map(p=>p[0]),y:points.map(p=>p[1]),z:points.map(p=>p[2]),text:labels,hovertext:hover,textposition:'top center',textfont:{size:11,color:'#294b63'},marker:{color,size,symbol},customdata:custom,hoverinfo:'text',showlegend:false};}
async function render(){
 const traces=[],scale=Number($('scale').value),key=$('field').value,field=D.fields[key],colored=key!=='geometry'&&D.solved;let colorbar=true;
 for(const e of D.elements){
  const curve=e.curve,samples=curve?curve.samples:null,orig=samples?samples.map(s=>s.coordinates):[e.start,e.end],deformed=samples?samples.map(s=>s.coordinates.map((v,i)=>v+scale*s.displacement[i])):null;
  const hover='构件 '+e.id+' · '+e.node_i+' → '+e.node_j+'<br>长度 '+fmt(e.length)+' m';
  if($('original').checked)traces.push(line([orig],'#335b78',6,hover,{kind:'element',id:e.id}));
  if(D.solved&&$('deformed').checked)traces.push(line([deformed],'#e78b45',5,hover+'<br>变形放大 '+scale+' 倍',{kind:'element',id:e.id}));
  if(colored){const pts=field.group==='displacement'&&$('deformed').checked?deformed:orig,values=curve.fields[key];traces.push({type:'scatter3d',mode:'lines',x:pts.map(p=>p[0]),y:pts.map(p=>p[1]),z:pts.map(p=>p[2]),line:field.all_zero?{width:8,color:'#91a4b4'}:{width:8,color:values,colorscale:key==='u_norm'?'Viridis':'RdBu',cmin:field.min,cmax:field.max,showscale:colorbar,colorbar:{title:{text:field.label+'<br>'+field.unit},thickness:12,len:.62,x:1.01}},text:samples.map((s,i)=>hover+'<br>x='+fmt(s.position)+' m ('+s.side+')<br>'+field.label+'='+fmt(values[i])+' '+field.unit),customdata:samples.map(s=>({kind:'element',id:e.id})),hoverinfo:'text',showlegend:false});colorbar=false;}
  if($('labels').checked)traces.push({type:'scatter3d',mode:'text',x:[(e.start[0]+e.end[0])/2],y:[(e.start[1]+e.end[1])/2],z:[(e.start[2]+e.end[2])/2],text:['杆 '+e.id],textfont:{size:12,color:'#3b617b'},hoverinfo:'skip',showlegend:false});
  if($('axes').checked){const center=e.start.map((v,i)=>(v+e.end[i])/2);for(let axis=0;axis<(isTruss?1:3);axis++){const tip=center.map((v,i)=>v+e.basis[i][axis]*D.span*.055);traces.push(line([[center,tip]],['#cb4b4b','#3b9d6f','#377bb3'][axis],3,'构件'+e.id+' 局部 '+['x','y','z'][axis]));}}
 }
 const points=D.nodes.map(n=>n.coordinates),texts=D.nodes.map(n=>'节点 '+n.id),custom=D.nodes.map(n=>({kind:'node',id:n.id}));
 traces.push(markers(points,texts,'#335b78',6,'circle',custom));
 if(D.solved&&$('deformed').checked)traces.push(markers(D.nodes.map(n=>n.coordinates.map((v,i)=>v+scale*n.displacement[i])),D.nodes.map(n=>'变形节点 '+n.id),'#e78b45',4,'circle',custom,D.nodes.map(n=>'变形节点 '+n.id),false));
 if($('supports').checked){const fixed=D.nodes.filter(n=>n.restrained.some(Boolean));traces.push(markers(fixed.map(n=>n.coordinates),fixed.map(n=>(activeDofs.every(i=>n.restrained[i])?'固定 ':'约束 ')+n.id),'#243947',7,'square',fixed.map(n=>({kind:'node',id:n.id})),fixed.map(n=>'支座 '+n.id+'<br>'+['ux','uy','uz','rx','ry','rz'].filter((k,i)=>n.restrained[i]).join(', '))));}
 if($('loads').checked)for(const glyph of D.glyphs)traces.push(line(glyph.paths,glyph.kind==='moment'?'#9466ac':'#c35f42',3,glyph.label));
 if($('sections').checked&&D.sections.length)traces.push(markers(D.sections.map(s=>s.coordinates),D.sections.map(s=>'截面 '+s.id),'#168d89',5,'cross',D.sections.map(s=>({kind:'section',id:s.id})),D.sections.map(s=>'截面 '+s.id+' · 构件 '+s.element_id+'<br>x='+fmt(s.position)+' m')));
 const note=colored?(field.label+' 色带：'+(field.group==='force'?'原构形上的局部截面分量，采样值':'全局位移/转角，采样值')+(field.all_zero?'（采样值全部为零）':'')):(D.solved?'原构形与放大变形叠加':'模型预览，未计算变形');$('modeNote').textContent=(view==='iso'?'三维视图 · ':view.toUpperCase()+' 等比例投影（隐藏方向可能使节点重合） · ')+note;
 const chartTitle={text:D.solved?'原构形与变形 ×'+scale+(colored?' · '+field.label+' / '+field.unit:''):'结构预览 · 尚未求解',font:{size:12,color:'#506b7e'},x:.04};
 let layout={title:chartTitle,font:{family:'Segoe UI, Microsoft YaHei, sans-serif'},paper_bgcolor:'#fff',margin:{l:28,r:colored?80:28,t:36,b:25},showlegend:false,uirevision:D.model_hash,scene:{aspectmode:'data',camera:initialCamera,xaxis:{title:{text:'X / m'},gridcolor:'#e2e9ef',showbackground:true,backgroundcolor:'#f7f9fb'},yaxis:{title:{text:'Y / m'},gridcolor:'#e2e9ef',showbackground:true,backgroundcolor:'#f7f9fb'},zaxis:{title:{text:'Z / m'},gridcolor:'#e2e9ef',showbackground:true,backgroundcolor:'#f7f9fb'}}};
 if(view!=='iso'){
  const axes={xy:[0,1],xz:[0,2],yz:[1,2]}[view];
  for(const trace of traces){const coordinates=[trace.x,trace.y,trace.z];trace.type='scatter';trace.x=coordinates[axes[0]];trace.y=coordinates[axes[1]];delete trace.z;
   if(trace.line&&Array.isArray(trace.line.color)){const style=trace.line;trace.mode='lines+markers';trace.marker={size:4,color:style.color,colorscale:style.colorscale,cmin:style.cmin,cmax:style.cmax,showscale:style.showscale,colorbar:style.colorbar};trace.line={color:'#b4c7d4',width:1};}
  }
  layout={title:chartTitle,font:{family:'Segoe UI, Microsoft YaHei, sans-serif'},paper_bgcolor:'#fff',plot_bgcolor:'#fbfcfd',margin:{l:60,r:colored?92:25,t:38,b:48},showlegend:false,uirevision:D.model_hash+'-'+view,xaxis:{title:{text:['X','Y','Z'][axes[0]]+' / m'},gridcolor:'#e3eaf0',zerolinecolor:'#cad6df'},yaxis:{title:{text:['X','Y','Z'][axes[1]]+' / m'},scaleanchor:'x',scaleratio:1,gridcolor:'#e3eaf0',zerolinecolor:'#cad6df'}};
 }
 try{await Plotly.react($('plot'),traces,layout,{responsive:true,displaylogo:false,modeBarButtonsToRemove:['sendChartToCloud'],toImageButtonOptions:{format:'png',filename:'space_frame_3d',width:1400,height:1000,scale:1}});if(firstPlot){$('plot').on('plotly_click',ev=>{const c=ev.points[0].customdata;if(!c)return;if(c.kind==='node'){nodeId=c.id;setTab('nodes');}else if(c.kind==='section'){sectionId=c.id;setTab('sections');}else{elementId=c.id;setTab('ends');}});firstPlot=false;}}catch(e){$('error').style.display='block';$('error').textContent='三维图未能显示：'+e.message+'。右侧数值仍可查看。';}
}
if(isTruss)document.querySelector('[data-tab=ends]').textContent='轴力';
$('title').textContent=D.title;$('status').textContent=D.solved?'已求解 · 数据匹配':'模型预览 · 尚未求解';$('hash').textContent='模型 '+D.model_hash.slice(0,16)+'…';
$('displayNotes').textContent=D.solved?'放大只改变图形，不改变数值。荷载箭头长度仅为示意。节点用全局坐标；内力色带是各杆局部分量。'+(D.deformation_note||'中心线变形已计入原始杆上荷载，扭转角可查数值，未绘制实体截面。')+'':'模型尚未求解，只展示原始几何、支座、荷载与截面查询位置。荷载箭头长度仅为示意。';if(!D.solved)$('deformationLegend').style.display='none';
$('metrics').innerHTML=[['节点 / 构件',D.nodes.length+' / '+D.elements.length],['荷载条目',D.loads.length],['查询截面',D.sections.length],['最大节点位移模 / m',D.solved?fmt(D.max_node_displacement_m):'尚未求解']].map(pair=>'<div class="metric"><small>'+pair[0]+'</small><strong>'+pair[1]+'</strong></div>').join('');
if(D.solved)for(const [key,value] of Object.entries(D.fields)){const option=document.createElement('option');option.value=key;option.textContent=value.label+' / '+value.unit;$('field').appendChild(option);}else{$('deformed').checked=false;$('deformed').disabled=true;$('scale').disabled=true;$('scaleSlider').disabled=true;}
$('scale').value=Math.round(D.default_scale);$('scaleSlider').value=$('scale').value;
$('scale').oninput=()=>{$('scale').value=Math.max(0,Math.min(1000,Number($('scale').value)));$('scaleSlider').value=$('scale').value;render();};$('scaleSlider').oninput=()=>{$('scale').value=$('scaleSlider').value;render();};
for(const id of ['field','original','deformed','loads','supports','labels','sections','axes'])$(id).onchange=render;
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.querySelectorAll('[data-camera]').forEach(b=>b.onclick=()=>{view=b.dataset.camera;document.querySelectorAll('[data-camera]').forEach(x=>x.classList.toggle('active',x===b));render();});$('reset').onclick=()=>{view='iso';document.querySelectorAll('[data-camera]').forEach(x=>x.classList.toggle('active',x.dataset.camera==='iso'));render().then(()=>Plotly.relayout($('plot'),{'scene.camera':initialCamera}));};
detail();render();new ResizeObserver(()=>Plotly.Plots.resize($('plot'))).observe($('plot'));
</script></body></html>
